<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bulky - Admin panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Шапка как у приложения: логотип, навигация по центру, выход справа -->
<header class="site-header">
    <nav class="container site-nav">
        <a class="site-logo site-nav-start" href="/home" aria-label="Bulky, home">
            <svg viewBox="0 0 150 40" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(0 -3) rotate(-18 20 20)" fill="#5b6b1e">
                    <rect x="2" y="12" width="5" height="16" rx="1.5"/>
                    <rect x="8" y="8" width="6" height="24" rx="2"/>
                    <rect x="14" y="18" width="12" height="4" rx="2"/>
                    <rect x="26" y="8" width="6" height="24" rx="2"/>
                    <rect x="33" y="12" width="5" height="16" rx="1.5"/>
                </g>
                <text x="50" y="30" font-family="'Big Shoulders Display', 'IBM Plex Sans', system-ui, sans-serif"
                      font-size="36" font-weight="800" letter-spacing="0.5" fill="#1a1813">
                    <tspan fill="#5b6b1e">B</tspan>ulky
                </text>
            </svg>
        </a>

        <div class="site-nav-center">
            <a class="dashboard-nav-btn" href="/admin" aria-current="page">Admin panel</a>
            <a class="dashboard-nav-btn" href="/dashboard/workout">Back to app</a>
        </div>

        <div class="site-nav-end">
            <button type="button" id="logout-btn" class="header-btn header-btn-ghost">Log out</button>
        </div>
    </nav>
</header>

<main class="container flex-grow-1 py-5 page-with-watermark">
    <!-- Декор: огромное название на фоне. Настоящий заголовок для скринридеров скрыт визуально -->
    <div class="page-watermark" aria-hidden="true">Admin</div>
    <h1 class="visually-hidden">Admin panel</h1>

    <div class="watermark-content page-column admin-sections">

        <!-- Группы мышц -->
        <section id="muscle-group-section" aria-labelledby="muscle-section-title">
            <h2 id="muscle-section-title" class="admin-section-title">Muscle groups</h2>

            <div class="admin-grid">
                <section class="panel">
                    <div class="admin-band">List</div>
                    <template id="muscle-element-template">
                        <li class="admin-row">
                            <button type="button" data-action="select" class="admin-row-select"></button>
                            <button type="button" data-action="archive" class="admin-row-action"></button>
                        </li>
                    </template>
                    <ul class="admin-list" id="muscle-list"></ul>
                </section>

                <div class="admin-forms">
                    <section class="panel">
                        <div class="admin-band">Create</div>
                        <div class="admin-error d-none" id="muscle-create-error" role="alert"></div>
                        <form id="muscle-create-form" class="admin-form">
                            <fieldset>
                                <div class="mb-3">
                                    <label class="form-label" for="muscle-create-title">Title</label>
                                    <input class="form-control" id="muscle-create-title" name="title" type="text">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="muscle-create-description">Description</label>
                                    <textarea class="form-control" id="muscle-create-description" name="description" rows="3"></textarea>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="muscle-create-image">Image</label>
                                    <input class="form-control" id="muscle-create-image" name="image" type="file" accept="image/*">
                                </div>
                                <button class="header-btn header-btn-primary w-100" id="muscle-create-btn">Create</button>
                            </fieldset>
                        </form>
                    </section>

                    <section class="panel">
                        <div class="admin-band">Edit</div>
                        <div class="admin-error d-none" id="muscle-edit-error" role="alert"></div>
                        <form id="muscle-edit-form" class="admin-form">
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label class="form-label" for="muscle-edit-title">Title</label>
                                    <input class="form-control" id="muscle-edit-title" name="title" type="text">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="muscle-edit-description">Description</label>
                                    <textarea class="form-control" id="muscle-edit-description" name="description" rows="3"></textarea>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="muscle-edit-image">Image</label>
                                    <input class="form-control" id="muscle-edit-image" name="image" type="file" accept="image/*">
                                </div>
                                <button class="header-btn header-btn-primary w-100" id="muscle-edit-btn">Save</button>
                            </fieldset>
                        </form>
                    </section>
                </div>
            </div>
        </section>

        <!-- Упражнения -->
        <section id="exercise-section" aria-labelledby="exercise-section-title">
            <h2 id="exercise-section-title" class="admin-section-title">Exercises</h2>

            <!-- Строка выбора групп мышц для упражнения. admin-page.js читает: первый span (название),
                 input и следующий за ним label (должен идти сразу после input), data-muscle-id -->
            <template id="exercise-muscles-list-template">
                <div data-muscle-id class="admin-muscle-row">
                    <span class="admin-muscle-name"></span>
                    <div class="segmented" role="group" aria-label="Role">
                        <input type="radio" name="muscle" value="none" checked>
                        <label>None</label>
                        <input type="radio" name="muscle" value="primary">
                        <label>Primary</label>
                        <input type="radio" name="muscle" value="secondary">
                        <label>Secondary</label>
                    </div>
                </div>
            </template>

            <div class="admin-grid">
                <section class="panel">
                    <div class="admin-band">List</div>
                    <template id="exercise-element-template">
                        <li class="admin-row">
                            <button type="button" data-action="select" class="admin-row-select"></button>
                            <button type="button" data-action="archive" class="admin-row-action"></button>
                        </li>
                    </template>
                    <ul class="admin-list" id="exercise-list"></ul>
                </section>

                <div class="admin-forms">
                    <section class="panel">
                        <div class="admin-band">Create</div>
                        <div class="admin-error d-none" id="exercise-create-error" role="alert"></div>
                        <form id="exercise-create-form" class="admin-form">
                            <fieldset>
                                <div class="mb-3">
                                    <label class="form-label" for="exercise-create-title">Title</label>
                                    <input class="form-control" id="exercise-create-title" name="title" type="text">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="exercise-create-description">Description</label>
                                    <textarea class="form-control" id="exercise-create-description" name="description" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <div class="form-label">Muscle groups</div>
                                    <div class="admin-muscles" id="exercise-create-muscles"></div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="exercise-create-image">Image</label>
                                    <input class="form-control" id="exercise-create-image" name="image" type="file" accept="image/*">
                                </div>
                                <button class="header-btn header-btn-primary w-100" id="exercise-create-btn">Create</button>
                            </fieldset>
                        </form>
                    </section>

                    <section class="panel">
                        <div class="admin-band">Edit</div>
                        <div class="admin-error d-none" id="exercise-edit-error" role="alert"></div>
                        <form id="exercise-edit-form" class="admin-form">
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label class="form-label" for="exercise-edit-title">Title</label>
                                    <input class="form-control" id="exercise-edit-title" name="title" type="text">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="exercise-edit-description">Description</label>
                                    <textarea class="form-control" id="exercise-edit-description" name="description" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <div class="form-label">Muscle groups</div>
                                    <div class="admin-muscles" id="exercise-edit-muscles"></div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="exercise-edit-image">Image</label>
                                    <input class="form-control" id="exercise-edit-image" name="image" type="file" accept="image/*">
                                </div>
                                <button class="header-btn header-btn-primary w-100" id="exercise-edit-btn">Save</button>
                            </fieldset>
                        </form>
                    </section>
                </div>
            </div>
        </section>

    </div>
</main>
<script type="module" src="/js/pages/admin-page.js"></script>
</body>
</html>
