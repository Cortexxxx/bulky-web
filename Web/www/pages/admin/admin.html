<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bulky - Admin panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="site-header">
    <nav class="container row align-items-center py-3 mx-auto">
        <div class="col site-logo">
            <svg viewBox="0 0 150 40" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <g transform="rotate(-18 20 20)" fill="#0e7c66">
                    <rect x="2" y="12" width="5" height="16" rx="1.5"/>
                    <rect x="8" y="8" width="6" height="24" rx="2"/>
                    <rect x="14" y="18" width="12" height="4" rx="2"/>
                    <rect x="26" y="8" width="6" height="24" rx="2"/>
                    <rect x="33" y="12" width="5" height="16" rx="1.5"/>
                </g>
                <text x="50" y="30" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
                      font-size="30" font-weight="800" letter-spacing="-1.2" fill="#14181f">
                    <tspan fill="#0e7c66">B</tspan>ulky
                </text>
            </svg>
        </div>

        <div class="col-auto fw-semibold fs-5">Admin panel</div>

        <div class="col text-end">
            <button type="button" id="logout-btn" class="btn btn-outline-dark btn-sm px-3">Log out</button>
        </div>
    </nav>
</header>

<main class="container flex-grow-1 py-5 d-flex flex-column gap-5">
        <section id="muscle-group-section">
            <h2 class="h4 mb-3">Muscle groups</h2>
            <div class="row g-4">
                <div class="col-lg-4 d-flex flex-column gap-4">
                <section class="card shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h3 class="h6 text-secondary text-uppercase mb-3">Create</h3>
                        <form id="muscle-group-create-form">
                            <fieldset>
                                <div class="mb-3">
                                    <label class="form-label" for="muscle-group-create-title">Title</label>
                                    <input class="form-control" id="muscle-group-create-title" name="title" type="text">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="muscle-group-create-description">Description</label>
                                    <textarea class="form-control" id="muscle-group-create-description" name="description" rows="3"></textarea>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="muscle-group-create-image">Image</label>
                                    <input class="form-control" id="muscle-group-create-image" name="image" type="file" accept="image/*">
                                </div>
                                <button class="btn btn-primary w-100" id="muscle-group-create-btn">Create</button>
                            </fieldset>
                        </form>
                    </div>
                </section>

                <section class="card shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h3 class="h6 text-secondary text-uppercase mb-3">Edit</h3>
                        <form id="muscle-group-edit-form">
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label class="form-label" for="muscle-group-edit-title">Title</label>
                                    <input class="form-control" id="muscle-group-edit-title" name="title" type="text">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="muscle-group-edit-description">Description</label>
                                    <textarea class="form-control" id="muscle-group-edit-description" name="description" rows="3"></textarea>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="muscle-group-edit-image">Image</label>
                                    <input class="form-control" id="muscle-group-edit-image" name="image" type="file" accept="image/*">
                                </div>
                                <button class="btn btn-primary w-100" id="muscle-group-edit-btn">Save</button>
                            </fieldset>
                        </form>
                    </div>
                </section>
                </div>

                <div class="col-lg-8">
                    <section class="card shadow-sm rounded-4 h-100">
                        <div class="card-body p-4">
                            <h3 class="h6 text-secondary text-uppercase mb-3">List</h3>
                            <ul class="list-group" id="muscle-group-list">
                                <!-- sample item, replace with rendered items -->
                                <li class="list-group-item d-flex align-items-center gap-2 p-0">
                                    <button type="button" class="list-group-item-action border-0 bg-transparent text-start px-3 py-2 flex-grow-1">Chest</button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm me-2">Archive</button>
                                </li>
                                <li class="list-group-item d-flex align-items-center gap-2 p-0 archived">
                                    <button type="button" class="list-group-item-action border-0 bg-transparent text-start px-3 py-2 flex-grow-1">Triceps</button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm me-2">Unarchive</button>
                                </li>
                            </ul>
                        </div>
                    </section>
                </div>
            </div>
        </section>

        <section id="exercise-section">
            <h2 class="h4 mb-3">Exercises</h2>
            <div class="row g-4">
                <div class="col-lg-4 d-flex flex-column gap-4">
                <section class="card shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h3 class="h6 text-secondary text-uppercase mb-3">Create</h3>
                        <form id="exercise-create-form">
                            <fieldset>
                                <div class="mb-3">
                                    <label class="form-label" for="exercise-create-title">Title</label>
                                    <input class="form-control" id="exercise-create-title" name="title" type="text">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="exercise-create-description">Description</label>
                                    <textarea class="form-control" id="exercise-create-description" name="description" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <div class="form-label">Muscle groups</div>
                                    <div class="list-group list-group-flush border-top border-bottom overflow-auto"
                                         id="exercise-create-muscles" style="max-height: 14rem">
                                        <!-- sample row, replace with rendered muscle groups -->
                                        <div class="list-group-item d-flex align-items-center justify-content-between gap-2 px-0">
                                            <span>Chest</span>
                                            <div class="btn-group btn-group-sm" role="group" aria-label="Chest role">
                                                <input class="btn-check" type="radio" name="muscle-1" id="exercise-create-muscle-1-none" value="none" checked>
                                                <label class="btn btn-outline-secondary" for="exercise-create-muscle-1-none">None</label>
                                                <input class="btn-check" type="radio" name="muscle-1" id="exercise-create-muscle-1-primary" value="primary">
                                                <label class="btn btn-outline-primary" for="exercise-create-muscle-1-primary">Primary</label>
                                                <input class="btn-check" type="radio" name="muscle-1" id="exercise-create-muscle-1-secondary" value="secondary">
                                                <label class="btn btn-outline-dark" for="exercise-create-muscle-1-secondary">Secondary</label>
                                            </div>
                                        </div>
                                        <!-- sample row, replace with rendered muscle groups -->
                                        <div class="list-group-item d-flex align-items-center justify-content-between gap-2 px-0">
                                            <span>Back</span>
                                            <div class="btn-group btn-group-sm" role="group" aria-label="Back role">
                                                <input class="btn-check" type="radio" name="muscle-2" id="exercise-create-muscle-2-none" value="none" checked>
                                                <label class="btn btn-outline-secondary" for="exercise-create-muscle-2-none">None</label>
                                                <input class="btn-check" type="radio" name="muscle-2" id="exercise-create-muscle-2-primary" value="primary">
                                                <label class="btn btn-outline-primary" for="exercise-create-muscle-2-primary">Primary</label>
                                                <input class="btn-check" type="radio" name="muscle-2" id="exercise-create-muscle-2-secondary" value="secondary">
                                                <label class="btn btn-outline-dark" for="exercise-create-muscle-2-secondary">Secondary</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="exercise-create-image">Image</label>
                                    <input class="form-control" id="exercise-create-image" name="image" type="file" accept="image/*">
                                </div>
                                <button class="btn btn-primary w-100" id="exercise-create-btn">Create</button>
                            </fieldset>
                        </form>
                    </div>
                </section>

                <section class="card shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h3 class="h6 text-secondary text-uppercase mb-3">Edit</h3>
                        <form id="exercise-edit-form">
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label class="form-label" for="exercise-edit-title">Title</label>
                                    <input class="form-control" id="exercise-edit-title" name="title" type="text">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="exercise-edit-description">Description</label>
                                    <textarea class="form-control" id="exercise-edit-description" name="description" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <div class="form-label">Muscle groups</div>
                                    <div class="list-group list-group-flush border-top border-bottom overflow-auto"
                                         id="exercise-edit-muscles" style="max-height: 14rem">
                                        <!-- sample row, replace with rendered muscle groups -->
                                        <div class="list-group-item d-flex align-items-center justify-content-between gap-2 px-0">
                                            <span>Chest</span>
                                            <div class="btn-group btn-group-sm" role="group" aria-label="Chest role">
                                                <input class="btn-check" type="radio" name="muscle-1" id="exercise-edit-muscle-1-none" value="none" checked>
                                                <label class="btn btn-outline-secondary" for="exercise-edit-muscle-1-none">None</label>
                                                <input class="btn-check" type="radio" name="muscle-1" id="exercise-edit-muscle-1-primary" value="primary">
                                                <label class="btn btn-outline-primary" for="exercise-edit-muscle-1-primary">Primary</label>
                                                <input class="btn-check" type="radio" name="muscle-1" id="exercise-edit-muscle-1-secondary" value="secondary">
                                                <label class="btn btn-outline-dark" for="exercise-edit-muscle-1-secondary">Secondary</label>
                                            </div>
                                        </div>
                                        <!-- sample row, replace with rendered muscle groups -->
                                        <div class="list-group-item d-flex align-items-center justify-content-between gap-2 px-0">
                                            <span>Back</span>
                                            <div class="btn-group btn-group-sm" role="group" aria-label="Back role">
                                                <input class="btn-check" type="radio" name="muscle-2" id="exercise-edit-muscle-2-none" value="none" checked>
                                                <label class="btn btn-outline-secondary" for="exercise-edit-muscle-2-none">None</label>
                                                <input class="btn-check" type="radio" name="muscle-2" id="exercise-edit-muscle-2-primary" value="primary">
                                                <label class="btn btn-outline-primary" for="exercise-edit-muscle-2-primary">Primary</label>
                                                <input class="btn-check" type="radio" name="muscle-2" id="exercise-edit-muscle-2-secondary" value="secondary">
                                                <label class="btn btn-outline-dark" for="exercise-edit-muscle-2-secondary">Secondary</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="exercise-edit-image">Image</label>
                                    <input class="form-control" id="exercise-edit-image" name="image" type="file" accept="image/*">
                                </div>
                                <button class="btn btn-primary w-100" id="exercise-edit-btn">Save</button>
                            </fieldset>
                        </form>
                    </div>
                </section>
                </div>

                <div class="col-lg-8">
                    <section class="card shadow-sm rounded-4 h-100">
                        <div class="card-body p-4">
                            <h3 class="h6 text-secondary text-uppercase mb-3">List</h3>
                            <ul class="list-group" id="exercise-list">
                                <!-- sample item, replace with rendered items -->
                                <li class="list-group-item d-flex align-items-center gap-2 p-0">
                                    <button type="button" class="list-group-item-action border-0 bg-transparent text-start px-3 py-2 flex-grow-1">Bench press</button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm me-2">Archive</button>
                                </li>
                                <li class="list-group-item d-flex align-items-center gap-2 p-0 archived">
                                    <button type="button" class="list-group-item-action border-0 bg-transparent text-start px-3 py-2 flex-grow-1">Dips</button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm me-2">Unarchive</button>
                                </li>
                            </ul>
                        </div>
                    </section>
                </div>
            </div>
        </section>
</main>

</body>
</html>
