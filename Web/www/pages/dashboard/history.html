<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bulky - History</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
{{header}}
<main class="container flex-grow-1 py-5">
    <div class="history-page">

        <header class="page-header">
            <h1 class="page-title">History</h1>
            <p class="page-subtitle">Your completed workouts</p>
        </header>

        <!-- Тестовые карточки: потом список наполнит JS.
             Карточка это button, чтобы её можно было открыть с клавиатуры. -->
        <div id="history-list" class="history-list">

            <button type="button" class="history-card" aria-haspopup="dialog">
                <svg class="history-card-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M9 6l6 6-6 6"/>
                </svg>
                <span class="history-card-number">3</span>
                <span class="history-card-main">
                    <span class="history-card-title">Push day</span>
                    <span class="history-card-date">Nov 9, 2026, 6:40 PM</span>
                </span>
                <span class="history-card-duration">1 h 12 min</span>
            </button>

            <button type="button" class="history-card" aria-haspopup="dialog">
                <svg class="history-card-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M9 6l6 6-6 6"/>
                </svg>
                <span class="history-card-number">2</span>
                <span class="history-card-main">
                    <span class="history-card-title">Legs</span>
                    <span class="history-card-date">Nov 6, 2026, 7:05 PM</span>
                </span>
                <span class="history-card-duration">58 min</span>
            </button>

            <button type="button" class="history-card" aria-haspopup="dialog">
                <svg class="history-card-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M9 6l6 6-6 6"/>
                </svg>
                <span class="history-card-number">1</span>
                <span class="history-card-main">
                    <span class="history-card-title">Nov 3, 2026, 7:15:42 PM</span>
                    <span class="history-card-date">Nov 3, 2026, 7:15 PM</span>
                </span>
                <span class="history-card-duration">45 min</span>
            </button>

        </div>
    </div>
</main>

<!-- Просмотр тренировки: те же карточки упражнений, что на странице тренировки, но без кнопок и полей ввода -->
<dialog id="history-dialog" class="app-dialog app-dialog-lg history-dialog" aria-labelledby="history-dialog-title">
    <header class="app-dialog-header">
        <div class="history-dialog-heading">
            <h2 id="history-dialog-title" class="app-dialog-title">Push day</h2>
            <p class="history-dialog-meta">Nov 9, 2026, 6:40 PM · 1 h 12 min</p>
        </div>
        <form method="dialog">
            <button type="submit" class="header-btn header-btn-neutral dialog-close" aria-label="Close" title="Close">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>
        </form>
    </header>

    <div class="app-dialog-body history-dialog-body">

        <article class="exercise-card exercise-card-readonly">
            <header class="exercise-header">
                <span class="exercise-number">1</span>
                <h3 class="exercise-name">Barbell bench press</h3>
            </header>
            <div class="sets">
                <div class="set-row set-row-head" aria-hidden="true">
                    <span>Set</span>
                    <span>Weight, kg</span>
                    <span>Reps</span>
                </div>
                <div class="set-row">
                    <span class="set-number">1</span>
                    <span class="set-value">60</span>
                    <span class="set-value">10</span>
                </div>
                <div class="set-row">
                    <span class="set-number">2</span>
                    <span class="set-value">70</span>
                    <span class="set-value">8</span>
                </div>
                <div class="set-row">
                    <span class="set-number">3</span>
                    <span class="set-value">75</span>
                    <span class="set-value">6</span>
                </div>
            </div>
        </article>

        <article class="exercise-card exercise-card-readonly">
            <header class="exercise-header">
                <span class="exercise-number">2</span>
                <h3 class="exercise-name">Overhead press</h3>
            </header>
            <div class="sets">
                <div class="set-row set-row-head" aria-hidden="true">
                    <span>Set</span>
                    <span>Weight, kg</span>
                    <span>Reps</span>
                </div>
                <div class="set-row">
                    <span class="set-number">1</span>
                    <span class="set-value">40</span>
                    <span class="set-value">10</span>
                </div>
                <div class="set-row">
                    <span class="set-number">2</span>
                    <span class="set-value">42.5</span>
                    <span class="set-value">8</span>
                </div>
            </div>
        </article>

    </div>
</dialog>

{{toasts}}

<!-- Временно, только чтобы посмотреть модалку: открывает её по клику на любую карточку.
     Когда появится history-page.js, этот блок нужно удалить. -->
<script>
    const historyDialog = document.getElementById('history-dialog');
    for (const card of document.querySelectorAll('.history-card')) {
        card.addEventListener('click', () => historyDialog.showModal());
    }
</script>
</body>
</html>
