<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bulky - Personal account</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
{{header}}
<main class="container flex-grow-1 py-5">
    <h1 class="h3 mb-4">Account</h1>

    <div class="row g-4">
        <!-- Профиль -->
        <div class="col-lg-8">
            <section class="card shadow-sm rounded-4 h-100">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div id="account-avatar"
                             class="rounded-circle bg-success-subtle text-success-emphasis fw-bold fs-3 d-flex align-items-center justify-content-center flex-shrink-0"
                             style="width: 56px; height: 56px" aria-hidden="true">?</div>
                        <div>
                            <div id="account-email-title" class="fw-semibold fs-5">user@example.com</div>
                            <span class="badge text-bg-primary" id="account-role">User</span>
                        </div>
                    </div>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between gap-3 px-0 py-3">
                            <span class="text-secondary">Email</span>
                            <span class="fw-semibold text-break" id="account-email">user@example.com</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between gap-3 px-0 py-3">
                            <span class="text-secondary">Registered</span>
                            <span class="fw-semibold" id="account-registered">01 Jan 2025</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between gap-3 px-0 py-3">
                            <span class="text-secondary">Active sessions</span>
                            <span class="fw-semibold" id="account-sessions">1</span>
                        </li>
                    </ul>
                </div>
            </section>
        </div>

        <!-- Статистика + выход -->
        <div class="col-lg-4">
            <div class="d-flex flex-column gap-4 h-100">
                <section class="card shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h2 class="h6 text-secondary text-uppercase mb-3">Overview</h2>
                        <div class="row text-center g-2">
                            <div class="col-6">
                                <div class="fs-3 fw-bold text-primary" id="account-stat-workouts">0</div>
                                <div class="small text-secondary">Workouts</div>
                            </div>
                            <div class="col-6">
                                <div class="fs-3 fw-bold text-primary" id="account-stat-volume">0 kg</div>
                                <div class="small text-secondary">Total volume</div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="card shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h2 class="h6 text-secondary text-uppercase mb-3">Session</h2>
                        <button type="button" id="logout-btn" class="btn btn-outline-danger w-100">Log out</button>
                    </div>
                </section>
            </div>
        </div>
    </div>
</main>

</body>
</html>
