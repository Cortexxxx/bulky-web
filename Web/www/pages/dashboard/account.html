<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bulky - Personal account</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
{{header}}
<main class="container flex-grow-1 py-5 page-with-watermark">
    <!-- Декор: огромное название на фоне. Настоящий заголовок для скринридеров скрыт визуально -->
    <div class="page-watermark" aria-hidden="true">Account</div>
    <h1 class="visually-hidden">Account</h1>

    <!-- Одна карточка из трёх полос: профиль, данные, действия -->
    <div class="watermark-content page-column-narrow">
        <section class="panel" aria-label="Account">
            <div class="account-head">
                <div id="account-avatar" class="account-avatar" aria-hidden="true">?</div>
                <div class="account-identity">
                    <div id="account-username" class="account-title"></div>
                    <span id="account-role" class="account-role"></span>
                </div>
            </div>

            <dl class="account-details">
                <div class="account-row">
                    <dt>Email</dt>
                    <dd id="account-email"></dd>
                </div>
                <div class="account-row">
                    <dt>Registered</dt>
                    <dd id="account-registered"></dd>
                </div>
                <div class="account-row">
                    <dt>Active sessions</dt>
                    <dd id="account-sessions"></dd>
                </div>
            </dl>

            <div class="account-actions">
                <a href="/admin" id="admin-panel-btn" class="header-btn header-btn-primary d-none">Admin panel</a>
                <button type="button" id="logout-btn" class="header-btn header-btn-ghost">Log out</button>
            </div>
        </section>
    </div>
</main>
{{toasts}}
<script type="module" src="/js/pages/account-page.js"></script>
</body>
</html>
