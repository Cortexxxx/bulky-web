<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bulky - Guide</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
{{header}}
<main class="container flex-grow-1 py-5 page-with-watermark">
    <div class="page-watermark" aria-hidden="true">Guide</div>

    <div class="guide-layout page-column watermark-content">
        <div id="guide-categories" class="guide-filters panel" role="group" aria-label="Guide categories">
            <button type="button" id="guide-all" aria-pressed="true">All</button>
            <button type="button" id="guide-exercises" aria-pressed="false">Exercises</button>
            <button type="button" id="guide-programs" aria-pressed="false">Workout programs</button>
            <button type="button" id="guide-muscles" aria-pressed="false">Muscle groups</button>
        </div>

        <div>
            <section id="guide-list-panel" class="panel" aria-labelledby="guide-list-title">
                <div class="guide-heading">
                    <h1 id="guide-list-title">ALL</h1>
                    <label class="visually-hidden" for="guide-search">Search guides</label>
                    <input class="form-control" type="search" id="guide-search" placeholder="Search guides">
                </div>

                <ul id="guide-list" class="guide-list"></ul>
                <template id="guide-item-template">
                    <li>
                        <button type="button" class="guide-item-title"></button>
                    </li>
                </template>
            </section>

            <section id="guide-detail-panel" class="panel guide-detail" aria-labelledby="guide-title" hidden>
                <button type="button" id="guide-back" class="header-btn header-btn-ghost">Back to guides</button>
                <h1 id="guide-title"></h1>
                <p id="guide-description"></p>
                <img id="guide-image" alt="" hidden>
            </section>
        </div>
    </div>
</main>

{{toasts}}
<script type="module" src="/js/pages/guide-page.js"></script>
</body>
</html>
