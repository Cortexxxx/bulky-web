<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bulky - Guide</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
{{header}}
<main class="container flex-grow-1 py-5 page-with-watermark">
    <div class="page-watermark" aria-hidden="true">Guide</div>

    <div class="guide-layout page-column watermark-content">
        <div id="guide-categories" class="guide-filters panel" role="group" aria-label="Guide categories">
            <template id="guide-category-btn-template">
                <button type="button"></button>
            </template>
        </div>

        <section class="panel" aria-label="Guides">
            <div class="guide-heading">
                <label class="visually-hidden" for="guide-search">Search guides</label>
                <input class="form-control" type="search" id="guide-search" placeholder="Search guides">
                <output id="guide-count" class="guide-count" for="guide-search" aria-label="Matching guides">0</output>
            </div>

            <ul id="guide-list" class="guide-list"></ul>
            <template id="guide-item-template">
                <li>
                    <button type="button" class="guide-item-title"></button>
                </li>
            </template>
        </section>
    </div>
</main>

<dialog id="guide-dialog" class="app-dialog app-dialog-lg guide-dialog" aria-labelledby="guide-title">
    <header class="app-dialog-header">
        <form method="dialog">
            <button type="submit" class="guide-dialog-close" aria-label="Close guide" title="Close guide">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="m6 6 12 12M18 6 6 18"/>
                </svg>
            </button>
        </form>
        <h2 id="guide-title" class="app-dialog-title"></h2>
    </header>
    <div class="app-dialog-body">
        <p id="guide-description"></p>
        <img id="guide-image" alt="" hidden>
    </div>
</dialog>

{{toasts}}
<script type="module" src="/js/pages/guide-page.js"></script>
</body>
</html>
