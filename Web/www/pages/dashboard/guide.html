<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bulky - Guide</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
{{header}}
<main class="container flex-grow-1 py-5 page-with-watermark">
    <!-- Декор: огромное название на фоне. Настоящий заголовок для скринридеров скрыт визуально -->
    <div class="page-watermark" aria-hidden="true">Guide</div>
    <h1 class="visually-hidden">Guide</h1>

    <div class="watermark-content">
        <!-- Заглушка: здесь будет справочник упражнений -->
        <p class="history-empty">The exercise guide is coming soon</p>
    </div>
</main>

{{toasts}}
</body>
</html>
