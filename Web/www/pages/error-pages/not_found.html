<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bulky - 404: Page not found</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        .error-art { width: 100%; max-width: 340px; height: auto; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

{{guests_header}}

<main class="auth-main flex-grow-1 d-flex align-items-center justify-content-center px-3 py-5">
    <div class="text-center" style="max-width: 520px;">
        <svg class="error-art" viewBox="0 0 340 130" role="img" aria-label="Error 404" xmlns="http://www.w3.org/2000/svg">
            <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
               font-size="120" font-weight="800" fill="#14181f" text-anchor="middle">
                <text x="62" y="108">4</text>
                <text x="278" y="108">4</text>
            </g>
            <!-- блин от штанги вместо нуля -->
            <g transform="translate(170 68)">
                <circle r="52" fill="#0e7c66"/>
                <circle r="38" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
                <circle r="13" fill="#f4f5f7"/>

            </g>
        </svg>
        <h1 class="h2 fw-bold mt-4 mb-2">Page not found</h1>
        <p class="text-secondary mb-4">The page you are looking for does not exist or has been moved.</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a class="btn btn-primary px-4" href="/home">Back to home</a>
        </div>
    </div>
</main>

{{footer}}

</body>
</html>
