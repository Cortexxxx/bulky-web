<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bulky: log in</title>

    <!-- Если Bootstrap у тебя уже подключён, эти строки можно убрать -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="site-header">
    <nav class="container d-flex align-items-center justify-content-between py-3">
        <a class="site-logo" href="/home" aria-label="Bulky, home">
            <svg viewBox="0 0 150 40" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <g transform="rotate(-18 20 20)" fill="#0e7c66">
                    <rect x="2" y="12" width="5" height="16" rx="1.5"/>
                    <rect x="8" y="8" width="6" height="24" rx="2"/>
                    <rect x="14" y="18" width="12" height="4" rx="2"/>
                    <rect x="26" y="8" width="6" height="24" rx="2"/>
                    <rect x="33" y="12" width="5" height="16" rx="1.5"/>
                </g>
                <text x="50" y="30" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
                      font-size="30" font-weight="800" letter-spacing="-1.2" fill="#14181f">
                    <tspan fill="#0e7c66">B</tspan>ulky
                </text>
            </svg>
        </a>

        <div class="d-flex align-items-center gap-3">
            <a class="site-nav-link" href="/home">Home</a>
            <a class="btn btn-outline-dark btn-sm px-3" href="/login">Log in</a>
        </div>
    </nav>
</header>

<main class="auth-main flex-grow-1 d-flex align-items-center justify-content-center px-3 py-5">
    <div class="card auth-card">
        <div class="card-body p-4 p-sm-5">

            <!-- переключатель: вход / регистрация -->
            <ul class="nav nav-pills nav-fill auth-tabs mb-4" id="auth-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tab-login" type="button" role="tab"
                            data-bs-toggle="pill" data-bs-target="#pane-login"
                            aria-controls="pane-login" aria-selected="true">Log in</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-register" type="button" role="tab"
                            data-bs-toggle="pill" data-bs-target="#pane-register"
                            aria-controls="pane-register" aria-selected="false">Sign up</button>
                </li>
            </ul>

            <div class="tab-content">

                <!-- ВХОД -->
                <div class="tab-pane fade show active" id="pane-login" role="tabpanel"
                     aria-labelledby="tab-login" tabindex="0">
                    <h1 class="h4 fw-bold mb-1">Welcome back</h1>
                    <p class="text-secondary mb-4">Log in to continue your training diary.</p>

                    <div class="alert alert-danger d-none" id="login-error" role="alert"></div>

                    <form id="login-form">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="login-email" name="email"
                                   placeholder="Email" autocomplete="email" required>
                            <label for="login-email">Email</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="login-password" name="password"
                                   placeholder="Password" autocomplete="current-password" required>
                            <label for="login-password">Password</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Log in</button>
                    </form>
                </div>

                <!-- РЕГИСТРАЦИЯ -->
                <div class="tab-pane fade" id="pane-register" role="tabpanel"
                     aria-labelledby="tab-register" tabindex="0">
                    <h1 class="h4 fw-bold mb-1">Create an account</h1>
                    <p class="text-secondary mb-4">It takes less than a minute.</p>

                    <div class="alert alert-danger d-none" id="register-error" role="alert"></div>

                    <form id="register-form">
                        <div class="form-floating mb-3">
                            <input  class="form-control" id="register-email" name="email"
                                   placeholder="Email" autocomplete="email" required>
                            <label for="register-email">Email</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="register-password" name="password"
                                   placeholder="Password" autocomplete="new-password" minlength="8" required>
                            <label for="register-password">Password</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="register-password-repeat"
                                   name="passwordRepeat" placeholder="Repeat password"
                                   autocomplete="new-password" minlength="8" required>
                            <label for="register-password-repeat">Repeat password</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Sign up</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/pages/auth-page.js"></script>
</body>
</html>
