<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bulky: server error</title>

    <!-- Если Bootstrap у тебя уже подключён, эту строку можно убрать -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    <style>
        .error-art { width: 100%; max-width: 340px; height: auto; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="site-header">
    <nav class="container d-flex align-items-center justify-content-between py-3">
        <a class="site-logo" href="/home" aria-label="Bulky, home">
            <svg viewBox="0 0 150 40" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <!-- гантель, чуть наклонённая -->
                <g transform="rotate(-18 20 20)" fill="#0e7c66">
                    <rect x="2" y="12" width="5" height="16" rx="1.5"/>
                    <rect x="8" y="8" width="6" height="24" rx="2"/>
                    <rect x="14" y="18" width="12" height="4" rx="2"/>
                    <rect x="26" y="8" width="6" height="24" rx="2"/>
                    <rect x="33" y="12" width="5" height="16" rx="1.5"/>
                </g>
                <text x="50" y="30" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
                      font-size="30" font-weight="800" letter-spacing="-1.2" fill="#14181f">
                    <tspan fill="#0e7c66">B</tspan>ulky
                </text>
            </svg>
        </a>

        <div class="d-flex align-items-center gap-3">
            <a class="site-nav-link" href="/home">Home</a>
            <a class="btn btn-outline-dark btn-sm px-3" href="/login">Log in</a>
        </div>
    </nav>
</header>

<main class="auth-main flex-grow-1 d-flex align-items-center justify-content-center px-3 py-5">
    <div class="text-center" style="max-width: 520px;">
        <svg class="error-art" viewBox="0 0 340 130" role="img" aria-label="Error 505" xmlns="http://www.w3.org/2000/svg">
            <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
               font-size="120" font-weight="800" fill="#14181f" text-anchor="middle">
                <text x="62" y="108">5</text>
                <text x="278" y="108">0</text>
            </g>
            <!-- блин от штанги вместо нуля -->
            <g transform="translate(170 68)">
                <circle r="52" fill="#0e7c66"/>
                <circle r="38" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
                <circle r="13" fill="#f4f5f7"/>
                <path d="M-6 -34 L4 -14 L-4 -2 L6 14 L0 34" fill="none" stroke="#f4f5f7" stroke-width="4"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </svg>
        <h1 class="h2 fw-bold mt-4 mb-2">Something went wrong</h1>
        <p class="text-secondary mb-4">The server hit an unexpected problem. Please try again in a moment.</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a class="btn btn-primary px-4" href="/home">Back to home</a>
            <button class="btn btn-outline-dark px-4" type="button" onclick="location.reload()">Try again</button>
        </div>
    </div>
</main>

</body>
</html>
