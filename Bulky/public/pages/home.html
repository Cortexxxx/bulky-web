<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bulky: workout diary with analytics</title>

    <!-- Если Bootstrap у тебя уже подключён, эти две строки можно убрать -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <nav class="container d-flex align-items-center justify-content-between py-3">
        <a class="site-logo" href="/home" aria-label="Bulky, home">
            <svg viewBox="0 0 150 40" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <!-- гантель, чуть наклонённая -->
                <g transform="rotate(-18 20 20)" fill="#0e7c66">
                    <rect x="2" y="12" width="5" height="16" rx="1.5"/>
                    <rect x="8" y="8" width="6" height="24" rx="2"/>
                    <rect x="14" y="18" width="12" height="4" rx="2"/>
                    <rect x="26" y="8" width="6" height="24" rx="2"/>
                    <rect x="33" y="12" width="5" height="16" rx="1.5"/>
                </g>
                <text x="50" y="30" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
                      font-size="30" font-weight="800" letter-spacing="-1.2" fill="#14181f">
                    <tspan fill="#0e7c66">B</tspan>ulky
                </text>
            </svg>
        </a>

        <div class="d-flex align-items-center gap-3">
            <a class="site-nav-link" href="/home">Home</a>
            <a class="btn btn-outline-dark btn-sm px-3" href="/login">Log in</a>
        </div>
    </nav>
</header>

<main>
    <section class="container py-5">
        <div class="row align-items-center g-5 py-lg-5">
            <div class="col-lg-6">
                <span class="hero-badge mb-3">Workout diary with analytics</span>
                <h1 class="hero-title mb-3"><span>B</span>ulky</h1>
                <p class="lead text-secondary mb-4">
                    Log every set, see your weekly volume for each muscle group
                    and know exactly when it's time to add weight.
                </p>
                <a class="btn btn-primary btn-lg px-4" href="/login">Get started</a>
            </div>

            <div class="col-lg-6 text-center">
                <!-- иллюстрация: недельный объём по дням -->
                <svg class="hero-art" viewBox="0 0 520 360" role="img"
                     aria-label="Weekly training volume chart" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="0" width="520" height="360" rx="24" fill="#ffffff" stroke="#e3e6eb"/>

                    <text x="32" y="50" font-family="Inter, system-ui, sans-serif" font-size="14"
                          font-weight="600" fill="#5b6472">WEEKLY VOLUME</text>
                    <text x="32" y="84" font-family="Inter, system-ui, sans-serif" font-size="30"
                          font-weight="800" fill="#14181f">38 400 kg</text>

                    <rect x="372" y="62" width="116" height="30" rx="15" fill="#e1f3ea"/>
                    <text x="430" y="82" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
                          font-size="14" font-weight="700" fill="#0f5c3a">&#8593; +8% to last</text>

                    <!-- сетка -->
                    <g stroke="#eef0f3" stroke-width="1">
                        <line x1="32" y1="140" x2="488" y2="140"/>
                        <line x1="32" y1="190" x2="488" y2="190"/>
                        <line x1="32" y1="240" x2="488" y2="240"/>
                    </g>
                    <line x1="32" y1="290" x2="488" y2="290" stroke="#cbd1da" stroke-width="1.5"/>

                    <!-- столбцы -->
                    <g fill="#bfe0d6" transform="translate(12 0)">
                        <rect x="48"  y="215" width="40" height="75"  rx="8"/>
                        <rect x="120" y="170" width="40" height="120" rx="8"/>
                        <rect x="264" y="190" width="40" height="100" rx="8"/>
                        <rect x="408" y="230" width="40" height="60"  rx="8"/>
                    </g>
                    <g fill="#0e7c66" transform="translate(12 0)">
                        <rect x="192" y="130" width="40" height="160" rx="8"/>
                        <rect x="336" y="150" width="40" height="140" rx="8"/>
                    </g>

                    <!-- подписи дней -->
                    <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5b6472"
                       text-anchor="middle" transform="translate(12 0)">
                        <text x="68"  y="316">Mon</text>
                        <text x="140" y="316">Tue</text>
                        <text x="212" y="316">Wed</text>
                        <text x="284" y="316">Thu</text>
                        <text x="356" y="316">Fri</text>
                        <text x="428" y="316">Sat</text>
                    </g>
                </svg>
            </div>
        </div>
    </section>
</main>

</body>
</html>
